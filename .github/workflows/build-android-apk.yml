name: Build & Release WORLD FORGE AI Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile WORLD FORGE AI Engine APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required by Gradle 9.3.1 & AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug.keystore exists for APK signing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure google-services.json & firebase_applet_config.xml exist for CI
        run: |
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "369440577631",
              "project_id": "gen-lang-client-0711975910",
              "storage_bucket": "gen-lang-client-0711975910.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:369440577631:android:76a727cfbb974f63",
                  "android_client_info": {
                    "package_name": "com.aistudio.worldforge.wfai01"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "369440577631-ciwebclientplaceholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForCIBuildOnly0000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "369440577631-ciwebclientplaceholder.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-worldfor-76a727cf-bb97-4f63-96af-83cf2314820a</string>
          </resources>
          EOF
          fi

      - name: Compile WORLD FORGE AI
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Verify & Prepare Named Engine APK
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/WorldForgeAI-Engine-v0.1.0.apk
          unzip -t dist-apk/WorldForgeAI-Engine-v0.1.0.apk > /dev/null
          ls -lh dist-apk/WorldForgeAI-Engine-v0.1.0.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorldForgeAI-Engine-APK
          path: dist-apk/WorldForgeAI-Engine-v0.1.0.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-latest
          name: "WORLD FORGE AI Engine — Android APK (Latest Build)"
          body: |
            ## WORLD FORGE AI — Direct Android APK Download & Install
            Tap **`WorldForgeAI-Engine-v0.1.0.apk`** under **Assets** below to download and install the WORLD FORGE AI Engine directly on your Android phone.
          files: dist-apk/WorldForgeAI-Engine-v0.1.0.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
